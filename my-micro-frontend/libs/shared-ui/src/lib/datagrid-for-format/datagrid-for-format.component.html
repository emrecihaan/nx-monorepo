<div *ngIf="groupedCount>0" class="selected-data">
    <span class="caption" [innerHtml]="'GRID.SELECTED_GROUPS_COUNT' | translate"></span>
    <span>{{groupedCount}}</span>
</div>
<!-- 
[stateStoring]="{
    enabled: true,
    type: 'localStorage',
    storageKey: storageKey
  }"  -->
<div class="datagrid-container">
    <dx-data-grid *ngIf="columns && columns.length > 0" #dataGrid id="gridContainer" [dataSource]="Data"
        [keyExpr]="keyExpr"
        [showBorders]="true" [remoteOperations]="false" [allowColumnReordering]="true" [rowAlternationEnabled]="true"
        (onExporting)="onExporting($event)" (onSelectionChanged)="onSelectionChanged($event)"
        (onToolbarPreparing)="onToolbarPreparing($event)" (onRowUpdating)="onRowUpdating($event)"
        (onRowUpdated)="onRowUpdated($event)" (onContextMenuPreparing)="onContextMenuPreparing($event)" [stateStoring]="{
    enabled: false
  }" (onOptionChanged)="handlePropertyChange($event)"
        [customizeColumns]="customizeOptions ? customizeOptions : customizeColumns" [hoverStateEnabled]="true"
        [(selectedRowKeys)]="selectedRows" (onClick)="onClickRow($event)" showEditorAlways="true"
        [allowColumnResizing]="false" [columnResizingMode]="'widget'" [columnMinWidth]="79"
        (onCellPrepared)="subscriber==true?subscriberCell($event):onCellPrepared($event)"
        (onRowValidating)="onRowValidating($event)" (onEditingStart)="onEditingStart($event)" [height]="height">

        <dxo-column-chooser [enabled]="true" mode="select">
            <!-- <dxo-search [enabled]="true" [editorOptions]="{ placeholder: 'Search column' }"></dxo-search> -->
            <!-- <dxo-selection [allowSelectAll]="true" [selectByClick]="true" [recursive]="true"></dxo-selection> -->
        </dxo-column-chooser>
        <dxo-column-fixing [enabled]="false"></dxo-column-fixing>
        <dxo-export [enabled]="true" [allowExportSelectedData]="true"></dxo-export>
        <dxo-grouping [autoExpandAll]="false"></dxo-grouping>
        <dxo-group-panel [visible]="showGroupPanel"></dxo-group-panel>
        <dxo-filter-row [visible]="true"></dxo-filter-row>
        <dxo-header-filter [visible]="true"></dxo-header-filter>
        <dxo-search-panel [visible]="false" [width]="240" placeholder="Arama..."></dxo-search-panel>
        <dxo-editing mode="row" [allowUpdating]="rowUpdate" [allowDeleting]="rowDelete" [allowAdding]="rowAdd" [useIcons]="true">
        </dxo-editing>
        <dxo-grouping [contextMenuEnabled]="true"> </dxo-grouping>

        <dxo-selection mode="multiple" [deferred]="false" *ngIf="selectionMode=='multiple'"></dxo-selection>

        <dxo-selection mode="multiple" [deferred]="false" *ngIf="selectionMode=='multipleButOneColumn'"></dxo-selection>

        <dxo-selection mode="single" *ngIf="selectionMode=='single'"></dxo-selection>

        <dxo-load-panel [enabled]="true"></dxo-load-panel>

        <dxo-scrolling mode="standard"></dxo-scrolling>

        <dxo-paging [pageSize]="pageSize"></dxo-paging>
        <dxo-pager [showPageSizeSelector]="true" [allowedPageSizes]="allowedPageSize" [showInfo]="true">
        </dxo-pager>

        <dxi-column *ngIf="customButton == true" type="buttons">
            <dxi-button [icon]="customButtonIcon ? customButtonIcon : searchIcon" [text]="customButtonName"
                [hint]="customButtonName" [onClick]="onClickCustomButton">
            </dxi-button>
            <dxi-button *ngIf="customButtonName2" [icon]="customButtonIcon2 ? customButtonIcon2 : save"
                [text]="customButtonName2" [hint]="customButtonName2" [onClick]="onClickCustomButton2">
            </dxi-button>
            <dxi-button *ngIf="customButtonName3" icon="tel" [text]="customButtonName3" [hint]="customButtonName3"
                [onClick]="onClickCustomButton3">
            </dxi-button>
            <dxi-button *ngIf="customDelete == true" [icon]="'trash'" [text]="Sil" [hint]="Sil"
                [onClick]="onClickDelete">
            </dxi-button>
            <dxi-button *ngIf="customButtonNameIndex"
                [icon]="customButtonIconIndex ? customButtonIconIndex : searchIcon" icon="tel"
                [text]="customButtonNameIndex" [hint]="customButtonNameIndex" [onClick]="onClickCustomButtonIndex">
            </dxi-button>
        </dxi-column>

        <dxi-column [allowEditing]="rowUpdate" *ngFor="let colm of columns; let k = index" [dataField]="colm.dataField"
            [caption]="colm.caption"
            [format]="colm.format" [dataType]="dataTypeFunc(colm)" [width]="colm.width"
            [calculateFilterExpression]="calculateFilterExpression">
            <dxo-lookup *ngIf="colm.lookup" [dataSource]="colm.lookup.dataSource"
                [displayExpr]="colm.lookup.displayExpr" [valueExpr]="colm.lookup.valueExpr">
            </dxo-lookup>
        </dxi-column>

        <dxo-summary *ngIf="subscriber == true">
            <dxi-total-item column="TeamName" displayFormat="Toplam:">
            </dxi-total-item>
            <dxi-total-item column="Received" summaryType="sum" displayFormat="{0}">
            </dxi-total-item>
            <dxi-total-item column="OnTheField" summaryType="sum" displayFormat="{0}">
            </dxi-total-item>
            <dxi-total-item column="Opened" summaryType="sum" displayFormat="{0}">
            </dxi-total-item>
            <dxi-total-item column="NotOpened" summaryType="sum" displayFormat="{0}">
            </dxi-total-item>
        </dxo-summary>

        <dxo-master-detail *ngIf="detailColumns" [enabled]="true" template="detail"></dxo-master-detail>
        <div *dxTemplate="let detail of 'detail'">
            <div class="master-detail-caption" *ngIf="detailHeader">{{detailHeader}}</div>
            <dx-data-grid [dataSource]="detail.data[detailDataField]" [showBorders]="true" [columnAutoWidth]="true">
                <dxi-column *ngFor="let colm of detailColumns" [dataField]="colm.dataField"
                    [caption]="colm.caption" [format]="colm.format" [dataType]="dataTypeFunc(colm)">
                </dxi-column>
            </dx-data-grid>
        </div>

    </dx-data-grid>
</div>
