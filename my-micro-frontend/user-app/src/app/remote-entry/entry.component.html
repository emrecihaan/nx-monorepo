<div class="users-page">
    <!-- Removed Toast -->

    <!-- Add User Form -->
    <div class="form-section animate-fade-in">
        <div class="form-card card">
            <div class="card-header">
                <div>
                    <h3 class="card-title">{{ 'USER.TITLE' | translate }}</h3>
                    <p class="card-subtitle">{{ 'USER.FORM.FORM_SUBTITLE' | translate }}</p>
                </div>
                <p-button icon="pi pi-refresh" [rounded]="true" [text]="true" (click)="resetForm()"
                    severity="secondary"></p-button>
            </div>

            <div class="form-grid">
                <div class="form-field">
                    <p-floatlabel variant="on">
                        <input pInputText id="userCode" type="text" [(ngModel)]="newUser.userCode" class="w-full" />
                        <label for="userCode">Kullanıcı Kodu *</label>
                    </p-floatlabel>
                </div>

                <div class="form-field">
                    <p-floatlabel variant="on">
                        <input pInputText id="userName" type="text" [(ngModel)]="newUser.userName" class="w-full" />
                        <label for="userName">Ad *</label>
                    </p-floatlabel>
                </div>

                <div class="form-field">
                    <p-floatlabel variant="on">
                        <input pInputText id="userSurname" type="text" [(ngModel)]="newUser.userSurname"
                            class="w-full" />
                        <label for="userSurname">Soyad *</label>
                    </p-floatlabel>
                </div>

                <div class="form-field">
                    <p-floatlabel variant="on">
                        <input pInputText id="email" type="email" [(ngModel)]="newUser.email" class="w-full" />
                        <label for="email">E-posta *</label>
                    </p-floatlabel>
                </div>

                <div class="form-field">
                    <p-floatlabel variant="on">
                        <input pInputText id="phoneNumber1" type="tel" [(ngModel)]="newUser.phoneNumber1"
                            class="w-full" />
                        <label for="phoneNumber1">Telefon 1</label>
                    </p-floatlabel>
                </div>

                <div class="form-field">
                    <p-floatlabel variant="on">
                        <input pInputText id="phoneNumber2" type="tel" [(ngModel)]="newUser.phoneNumber2"
                            class="w-full" />
                        <label for="phoneNumber2">Telefon 2</label>
                    </p-floatlabel>
                </div>

                <div class="form-field">
                    <p-floatlabel variant="on">
                        <input pInputText id="gender" type="text" [(ngModel)]="newUser.gender" class="w-full" />
                        <label for="gender">Cinsiyet</label>
                    </p-floatlabel>
                </div>
            </div>

            <div class="form-actions">
                <p-button [label]="'USER.FORM.CLEAR_BUTTON' | translate" icon="pi pi-times" severity="secondary"
                    (click)="resetForm()"></p-button>
                <p-button [label]="'USER.FORM.ADD_BUTTON' | translate" icon="pi pi-plus" severity="success"
                    (click)="addUser()"></p-button>
            </div>
        </div>
    </div>

    <!-- Shared Reusable DataGrid -->
    <div class="table-section animate-fade-in" style="margin-bottom: 2rem;">
        <div class="card">
            <h3 class="card-title">Shared Reusable DataGrid</h3>

            <div *ngIf="loading" style="text-align: center; padding: 3rem;">
                <i class="pi pi-spin pi-spinner" style="font-size: 2rem; color: var(--primary-color);"></i>
                <p style="margin-top: 1rem; color: var(--text-color-secondary);">Kullanıcılar yükleniyor...</p>
            </div>

            <app-datagrid-for-format *ngIf="!loading" [Data]="users" [columns]="gridColumns" [gridId]="'userGrid'"
                [export]="true" [columnChooser]="true" [rowUpdate]="true">
            </app-datagrid-for-format>
        </div>
    </div>
