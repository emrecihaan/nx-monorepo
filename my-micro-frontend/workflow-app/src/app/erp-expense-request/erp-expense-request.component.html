<div class="surface-card p-3 shadow-1 border-round mb-4 flex flex-column xl:flex-row justify-content-between align-items-center gap-3">
    <!-- Filtreler Bölümü -->
    <div class="flex flex-column md:flex-row align-items-center gap-2 w-full xl:w-auto" [formGroup]="filterForm">
        <div class="flex flex-column md:flex-row align-items-center surface-ground border-round p-1 border-1 surface-border w-full">
            <div class="flex align-items-center text-color-secondary font-medium px-3 py-2 md:py-0 white-space-nowrap">
                <i class="pi pi-filter mr-2"></i>Filtreler
            </div>
            
            <input pInputText type="text" formControlName="formOwner" placeholder="Form Sahibi" class="w-full md:w-10rem mr-1 mb-2 md:mb-0" />
            
            <p-select id="formStatus" formControlName="formStatus" [options]="statusOptions" optionLabel="label"
                optionValue="value" placeholder="Durum" styleClass="w-full md:w-12rem mr-1 mb-2 md:mb-0"></p-select>
                
            <p-select id="periodYear" formControlName="periodYear" [options]="yearOptions" optionLabel="label"
                optionValue="value" placeholder="Yıl" styleClass="w-full md:w-7rem mr-1 mb-2 md:mb-0"></p-select>
                
            <p-select id="periodMonth" formControlName="periodMonth" [options]="monthOptions" optionLabel="label"
                optionValue="value" placeholder="Ay" styleClass="w-full md:w-7rem mr-1 mb-2 md:mb-0"></p-select>
                
            <p-datepicker id="sapDate" formControlName="sapDate" dateFormat="dd.mm.yy" [showClear]="true"
                placeholder="Sap Tarihi" styleClass="w-full md:w-10rem mr-1 mb-2 md:mb-0"></p-datepicker>
                
            <button pButton pRipple label="Ara" icon="pi pi-search" class="p-button-primary font-bold w-full md:w-auto px-4"
                style="min-width: 6rem;" type="button" (click)="onSearch()"></button>
        </div>
    </div>

    <!-- İşlemler Bölümü -->
    <div class="flex flex-column lg:flex-row align-items-stretch lg:align-items-center gap-2 flex-wrap w-full xl:w-auto mt-3 xl:mt-0 justify-content-end">
        <button pButton pRipple label="SAP'a Aktar" icon="pi pi-angle-double-right" (click)="sendSAP()"
          class="p-button-success w-full lg:w-auto"></button>

        <button pButton pRipple label="Sil" icon="pi pi-times-circle" (click)="underConstruction()"
          class="p-button-danger w-full lg:w-auto"></button>

        <button pButton pRipple label="Ters Kayıt" icon="pi pi-arrows-h" (click)="underConstruction()"
          class="p-button-warning w-full lg:w-auto"></button>
          
        <div class="border-left-1 surface-border h-2rem mx-1 hidden lg:block"></div>

        <button pButton pRipple label="Geri Gönder" icon="pi pi-arrow-circle-left" (click)="underConstruction()"
          class="p-button-secondary w-full lg:w-auto"></button>

        <button pButton pRipple label="Kart Harcamaları" icon="pi pi-credit-card" (click)="underConstruction()"
          class="p-button-help w-full lg:w-auto"></button>

        <button pButton pRipple label="Masraf Formu" icon="pi pi-file-pdf" (click)="underConstruction()"
          class="p-button-info w-full lg:w-auto"></button>
    </div>
</div>

<div>
  <app-datagrid-for-format [Data]="data" [customizeOptions]="customizeGrid" (setSelectedRows)="setSelectedRows($event)"
    [selectionMode]="'multipleButOneColumn'" [columns]="column" [customButton]="true" customButtonName="Görüntüle"
    customButtonIcon="edit" (customButtonReturn)="callShow($event)" [detailHeader]="detailHeader"
    [detailColumns]="detailColumn" [detailDataField]="'items'">
  </app-datagrid-for-format>
</div>

<p-toast></p-toast>
