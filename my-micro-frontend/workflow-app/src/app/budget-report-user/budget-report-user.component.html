<div class="budget-report-container">
    <div
        class="surface-card p-3 shadow-1 border-round mb-4 flex flex-column xl:flex-row justify-content-between align-items-center">
        <div class="flex flex-column md:flex-row align-items-center w-full xl:w-auto">
            <div
                class="flex flex-column md:flex-row align-items-center surface-ground border-round p-1 border-1 surface-border w-full">
                <div
                    class="flex align-items-center text-color-secondary font-medium px-3 py-2 md:py-0 white-space-nowrap">
                    <i class="pi pi-filter mr-2"></i>Filtreler
                </div>

                <p-select inputId="formSelect" [options]="formList" optionLabel="name" [(ngModel)]="selectedForm"
                    (onChange)="changeSelectedForm($event)" showClear="true" filter="true"
                    [placeholder]="'budgetReport.form' | translate"
                    styleClass="w-full md:w-20rem mr-1 mb-2 md:mb-0"></p-select>

                <p-select inputId="userSelect" [options]="userList" optionLabel="name" [(ngModel)]="selectedUser"
                    (onChange)="changeSelectedUser($event)" showClear="true" filter="true"
                    [placeholder]="'budgetReport.user' | translate"
                    styleClass="w-full md:w-20rem mr-1 mb-2 md:mb-0"></p-select>

                <p-select inputId="statusSelect" [options]="statusList" optionLabel="name" [(ngModel)]="selectedStatus"
                    (onChange)="changeSelectedStatus($event)" showClear="true" filter="true"
                    [placeholder]="'budgetReport.status' | translate"
                    styleClass="w-full md:w-14rem mr-1 mb-2 md:mb-0"></p-select>

                <p-datepicker inputId="startDate" [(ngModel)]="startDate" dateFormat="dd.mm.yy"
                    [placeholder]="'budgetReport.startDate' | translate"
                    styleClass="w-full md:w-14rem mr-1 mb-2 md:mb-0"></p-datepicker>

                <p-datepicker inputId="endDate" [(ngModel)]="endDate" dateFormat="dd.mm.yy"
                    [placeholder]="'budgetReport.endDate' | translate"
                    styleClass="w-full md:w-14rem mr-1 mb-2 md:mb-0"></p-datepicker>

                <button pButton pRipple label="{{'budgetReport.search' | translate}}" icon="pi pi-search"
                    class="p-button-primary font-bold w-full md:w-auto px-4" style="min-width: 6rem;"
                    (click)="getBudgetReportForUser()"></button>
            </div>
        </div>
    </div>

    <h2 class="text-2xl font-bold text-gray-900">{{'budgetReport.statistics' | translate}}</h2>
</div>

<div>
    <dx-chart #chart [dataSource]="chartData" [commonSeriesSettings]="{ type: 'bar', argumentField: 'user' }">
        <dxi-series valueField="amount" name="Harcama Tutarı"></dxi-series>
    </dx-chart>

    <dx-pivot-grid #pivotGrid id="pivotgrid" [dataSource]="pivotGridDataSource" [allowSortingBySummary]="true"
        [allowFiltering]="true" [showBorders]="true" [showColumnTotals]="false" [showColumnGrandTotals]="false"
        [showRowTotals]="false" [showRowGrandTotals]="false">
        <dxo-field-chooser [enabled]="true" [height]="400"></dxo-field-chooser>
    </dx-pivot-grid>
</div>

<p-toast></p-toast>
