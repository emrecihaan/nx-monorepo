<div class="expense-group-container">
    <h1 class="header1">{{'expenseGroup.title' | translate}}</h1>

    <p-accordion [value]="0">
        <p-accordion-panel [value]="0">
            <p-accordion-header>{{'expenseGroup.formTitle' | translate}}</p-accordion-header>
            <p-accordion-content>
                <form [formGroup]="expenseGroupForm" class="p-fluid">
                    <div class="grid align-items-start">
                        <div class="col-2 mt-4">
                            <p-floatlabel>
                                <input id="groupCode" type="text" pInputText formControlName="groupCode" />
                                <label for="groupCode">{{'expenseGroup.groupCode' | translate}}</label>
                            </p-floatlabel>
                            <small id="groupCode" *ngIf="expenseGroupForm.get('groupCode')?.invalid && formSubmitted"
                                class="p-error block"> {{'expenseGroup.groupCodeReq' |
                                translate}}</small>
                        </div>
                        <div class="col-2 mt-4">
                            <p-floatlabel>
                                <input id="groupName" type="text" pInputText formControlName="groupName" />
                                <label for="groupName">{{'expenseGroup.groupName' | translate}}</label>
                            </p-floatlabel>
                            <small id="groupName" *ngIf="expenseGroupForm.get('groupName')?.invalid && formSubmitted"
                                class="p-error block"> {{'expenseGroup.groupNameReq' |
                                translate}}</small>
                        </div>
                        <div class="col-3 mt-4">
                            <p-floatlabel>
                                <p-datepicker id="dateRange" formControlName="dateRange" selectionMode="range"
                                    dateFormat="dd/mm/yy" showIcon="true" styleClass="w-full"></p-datepicker>
                                <label for="dateRange">{{'expenseGroup.dateRange' | translate}}</label>
                            </p-floatlabel>
                            <small id="dateRange" *ngIf="expenseGroupForm.get('dateRange')?.invalid && formSubmitted"
                                class="p-error block"> {{'expenseGroup.dateRangeReq' | translate}}</small>
                        </div>
                        <div class="col-2 mt-4">
                            <p-floatlabel>
                                <p-select id="company" [options]="companyList" optionLabel="name" optionValue="id"
                                    formControlName="company" styleClass="w-full">
                                </p-select>
                                <label for="company">{{'expenseGroup.company' | translate}}</label>
                            </p-floatlabel>
                            <small id="company" *ngIf="expenseGroupForm.get('company')?.invalid && formSubmitted"
                                class="p-error block">
                                {{'expenseGroup.companyReq' | translate}}
                            </small>
                        </div>
                        <div class="col-2 mt-4">
                            <p-floatlabel>
                                <p-select id="status" [options]="statusOptions" formControlName="status"
                                    optionLabel="name" optionValue="id" [showClear]="true" styleClass="w-full">
                                </p-select>
                                <label for="status">{{'expenseGroup.status' | translate}}</label>
                            </p-floatlabel>
                            <small id="status" *ngIf="expenseGroupForm.get('status')?.invalid && formSubmitted"
                                class="p-error block">
                                {{'expenseGroup.statusReq' | translate}}
                            </small>
                        </div>
                        <div class="col-1 mt-4 flex align-items-start">
                            <button pButton label="{{'button.save' | translate}}" class="p-button-success w-full"
                                (click)="onSubmit()"></button>
                        </div>
                    </div>
                </form>
            </p-accordion-content>
        </p-accordion-panel>
    </p-accordion>

    <div class="mt-4">
        <p-panel>
            <app-datagrid-for-format [Data]="Data" [columns]="columns" [selectedData]="selectedRow"
                (setSelectedData)="setSelectedRow($event)" [selectionMode]="'single'" [rowUpdate]="true"
                (onRowUpdating)="onRowUpdate($event)">
            </app-datagrid-for-format>
        </p-panel>
    </div>

    <p-toast></p-toast>
</div>
