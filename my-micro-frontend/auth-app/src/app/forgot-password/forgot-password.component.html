<div class="login-page-wrapper">
    <p-toast></p-toast>

    <!-- Top Header -->
    <header class="login-header-nav">
        <div class="header-left">
            <div class="logo-container">
                <img src="/assets/images/btc_logo.png" alt="BTC Logo" class="logo-img">
            </div>
        </div>
        <div class="header-right">
            <div class="lang-selector">
                <p-button label="TR" [text]="true" [rounded]="true" (onClick)="switchLanguage('tr')"
                    [severity]="currentLang === 'tr' ? 'info' : 'secondary'"
                    [class.active]="currentLang === 'tr'"></p-button>
                <p-button label="EN" [text]="true" [rounded]="true" (onClick)="switchLanguage('en')"
                    [severity]="currentLang === 'en' ? 'info' : 'secondary'"
                    [class.active]="currentLang === 'en'"></p-button>
            </div>
        </div>
    </header>

    <div class="login-container">
        <div class="login-card animate-fade-in">
            <div class="login-header">
                <div class="logo-card-container">
                    <img src="assets/images/btc_logo.png" alt="BTC Logo" class="logo-card-img">
                </div>
            </div>

            <div class="form-section">
                <div class="form-field">
                    <p-floatlabel>
                        <input pInputText id="email" type="email" [(ngModel)]="email" class="w-full"
                            (keydown.enter)="sendVerification()" />
                        <label for="email">Email</label>
                    </p-floatlabel>
                </div>

                <div class="form-actions" style="display: flex; flex-direction: column; gap: 10px;">
                    <p-button label="Doğrulama Gönder" [loading]="loading" icon="pi pi-send"
                        styleClass="w-full" (onClick)="sendVerification()"></p-button>
                    
                    <p-button label="Geri Dön" icon="pi pi-arrow-left" severity="secondary" [text]="true"
                        styleClass="w-full" (onClick)="goBack()"></p-button>
                </div>
            </div>

            <div class="login-footer">
                <p>{{ 'LOGIN.FOOTER' | translate }}</p>
            </div>
        </div>
    </div>
</div>
