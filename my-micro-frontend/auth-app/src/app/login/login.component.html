<div class="login-page-wrapper">
    <p-toast></p-toast>

    <!-- Top Header -->
    <header class="login-header-nav">
        <div class="header-left">
            <div class="logo-container">
                <img src="/assets/images/btc_logo.png" alt="BTC Logo" class="logo-img">
            </div>
        </div>
        <div class="header-right">
            <div class="lang-selector">
                <p-button label="TR" [text]="true" [rounded]="true" (onClick)="switchLanguage('tr')"
                    [severity]="currentLang === 'tr' ? 'info' : 'secondary'"
                    [class.active]="currentLang === 'tr'"></p-button>
                <p-button label="EN" [text]="true" [rounded]="true" (onClick)="switchLanguage('en')"
                    [severity]="currentLang === 'en' ? 'info' : 'secondary'"
                    [class.active]="currentLang === 'en'"></p-button>
            </div>
        </div>
    </header>

    <div class="login-container">
        <div class="login-card animate-fade-in">
            <div class="login-header">
                <div class="logo-card-container">
                    <img src="assets/images/btc_logo.png" alt="BTC Logo" class="logo-card-img">
                </div>
            </div>

            <div class="form-section">
                <div class="form-field">
                    <p-floatlabel>
                        <input pInputText id="username" type="text" [(ngModel)]="username" class="w-full"
                            (keydown.enter)="login()" />
                        <label for="username">{{ 'LOGIN.USERNAME' | translate }}</label>
                    </p-floatlabel>
                </div>

                <div class="form-field">
                    <p-floatlabel>
                        <input pInputText id="password" type="password" [(ngModel)]="password" class="w-full"
                            (keydown.enter)="login()" />
                        <label for="password">{{ 'LOGIN.PASSWORD' | translate }}</label>
                    </p-floatlabel>
                    <div style="text-align: right; margin-top: 0.25rem;">
                        <a routerLink="/login/forgot-password"
                            style="font-size: 0.85rem; color: var(--primary-color); text-decoration: none; font-weight: 500;">Şifremi
                            Unuttum</a>
                    </div>
                </div>

                <div class="form-field">
                    <div class="captcha-wrapper"
                        style="display: flex; align-items: center; margin-bottom: 15px; background: #fafafa; border-radius: 8px; border: 1px solid var(--surface-200); overflow: hidden;">
                        <div style="flex-grow: 1; display: flex;">
                            <canvas #captchaCanvas width="350" height="75"
                                style="cursor: pointer; width: 100%; height: auto; display: block;"
                                (click)="generateCaptcha()" title="Kodu Yenile"></canvas>
                        </div>
                        <div style="padding: 0 10px; border-left: 1px solid var(--surface-200);">
                            <p-button icon="pi pi-refresh"
                                styleClass="p-button-rounded p-button-text p-button-secondary"
                                (onClick)="generateCaptcha()" pTooltip="Kodu Yenile" tooltipPosition="top"></p-button>
                        </div>
                    </div>
                    <p-floatlabel>
                        <input pInputText id="captcha" type="text" [(ngModel)]="captchaInput" class="w-full"
                            (keydown.enter)="login()" />
                        <label for="captcha">Güvenlik Kodu</label>
                    </p-floatlabel>
                </div>

                <div class="form-actions">
                    <p-button [label]="'LOGIN.BUTTON' | translate" [loading]="loading" icon="pi pi-sign-in"
                        styleClass="w-full" (onClick)="login()"></p-button>
                </div>
            </div>

            <div class="login-footer">
                <p>{{ 'LOGIN.FOOTER' | translate }}</p>
            </div>
        </div>
    </div>
</div>
