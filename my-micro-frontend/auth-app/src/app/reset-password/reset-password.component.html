<div class="login-page-wrapper">
    <p-toast></p-toast>

    <!-- Top Header -->
    <header class="login-header-nav">
        <div class="header-left">
            <div class="logo-container">
                <img src="/assets/images/btc_logo.png" alt="BTC Logo" class="logo-img">
            </div>
        </div>
    </header>

    <div class="login-container">
        <div class="login-card animate-fade-in">
            <div class="login-header">
                <div class="logo-card-container">
                    <img src="assets/images/btc_logo.png" alt="BTC Logo" class="logo-card-img">
                </div>
            </div>

            <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="form-section">
                <div class="form-field">
                    <p-floatlabel>
                        <p-password id="password" formControlName="password" class="w-full" [toggleMask]="true"></p-password>
                        <label for="password">Yeni Şifre</label>
                    </p-floatlabel>
                </div>

                <div class="form-field">
                    <p-floatlabel>
                        <p-password id="confirmPassword" formControlName="confirmPassword" class="w-full" [toggleMask]="true"></p-password>
                        <label for="confirmPassword">Yeni Şifre (Tekrar)</label>
                    </p-floatlabel>
                </div>

                <div class="form-actions" style="display: flex; flex-direction: column; gap: 10px;">
                    <p-button label="Şifreyi Sıfırla" [loading]="loading" icon="pi pi-check" styleClass="w-full"
                        type="submit" [disabled]="resetForm.invalid || !token"></p-button>

                    <p-button label="Geri Dön" icon="pi pi-arrow-left" severity="secondary" [text]="true"
                        styleClass="w-full" (onClick)="goBack()"></p-button>
                </div>
            </form>

            <div class="login-footer">
                <p>{{ 'LOGIN.FOOTER' | translate }}</p>
            </div>
        </div>
    </div>
</div>
